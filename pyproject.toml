[project]
name = "restaurante-cli"
version = "0.1.0"
description = "Sistema de gestión para restaurante: login de meseros y CRUD de platillos"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pytest>=9.0.2",
    "rich>=14.3.0",
    "ruff>=0.15.0",
    "typer>=0.12.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
