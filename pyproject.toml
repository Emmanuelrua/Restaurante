[project]
name = "restaurante-cli"
version = "0.1.0"
description = "Sistema de gestión para restaurante: login de meseros y CRUD de platillos"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.5",
    "mkdocstrings[python]>=1.0.3",
    "pymdown-extensions>=10.21",
    "pytest>=9.0.2",
    "python-dotenv>=1.0.0",
    "radon>=6.0.1",
    "requests>=2.32.0",
    "rich>=14.3.0",
    "ruff>=0.15.0",
    "typer>=0.12.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
